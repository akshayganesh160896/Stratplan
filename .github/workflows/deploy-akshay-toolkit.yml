name: Deploy Akshay's Toolkit to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "my projects/Akshay's Toolkit/**"
      - ".github/workflows/deploy-akshay-toolkit.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-akshay-toolkit"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "my projects/Akshay's Toolkit"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
